<script>
  let selected = null;

  function selectTable(el, name, cap) {
    if (el.classList.contains('reserved')) return; // can't select reserved

    if (selected) {
      selected.classList.remove('selected');
    }
    if (selected === el) {
      selected = null;
      document.getElementById('infoPanel').classList.remove('visible');
      return;
    }
    el.classList.add('selected');
    selected = el;
    document.getElementById('panelName').textContent = name;
    document.getElementById('panelCap').textContent = 'Capacidad: ' + cap + ' · Estado: Disponible';
    document.getElementById('infoPanel').classList.add('visible');
  }

  function clearSelection() {
    if (selected) { selected.classList.remove('selected'); selected = null; }
    document.getElementById('infoPanel').classList.remove('visible');
  }

  function confirmTable() {
    if (!selected) return;
    const name = document.getElementById('panelName').textContent;
    alert('✅ ' + name + ' seleccionada.\nSerás redirigido al formulario de reserva.');
    clearSelection();
  }
</script>
