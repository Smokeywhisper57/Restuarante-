<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión del Restaurante – Modificación de Reservas</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #f5f0e8;
      --brown: #3b2112;
      --brown-mid: #5c3d2e;
      --red: #e53e2f;
      --orange: #e8681a;
      --green: #27ae60;
      --white: #ffffff;
      --border: #ddd;
      --row-hover: #faf6f0;
      --th-bg: #f0ebe2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--brown); min-height: 100vh; }

    /* top nav */
    .top-bar {
      background: var(--white);
      padding: 10px 28px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid var(--cream);
      box-shadow: 0 2px 8px rgba(59,33,18,.07);
    }
    .top-bar .brand { font-size: .82rem; color: var(--brown-mid); }
    .top-bar .admin-tag {
      font-size: .78rem; font-weight: 700; background: var(--brown);
      color: var(--white); padding: 4px 12px; border-radius: 20px; letter-spacing: 1px;
    }

    .page { max-width: 1050px; margin: 0 auto; padding: 28px 28px 50px; }

    h1 {
      font-size: 1.05rem; font-weight: 900;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--brown); margin-bottom: 20px;
      border-left: 4px solid var(--brown); padding-left: 12px;
    }

    /* toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .btn {
      border: none; border-radius: 6px; padding: 10px 24px;
      font-family: 'Lato', sans-serif; font-size: .85rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn-activo { background: var(--brown); color: var(--white); }
    .btn-eliminar { background: var(--red); color: var(--white); }
    .btn-add {
      background: var(--white); border: 2px solid var(--brown);
      color: var(--brown); font-size: 1.3rem; padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 900;
      transition: background .15s;
    }
    .btn-add:hover { background: var(--cream); }

    .notif-box {
      margin-left: auto; background: var(--orange); color: var(--white);
      padding: 8px 16px; border-radius: 6px; font-size: .8rem;
      font-weight: 700; letter-spacing: .5px; position: relative;
      cursor: pointer;
    }
    .notif-badge {
      position: absolute; top: -7px; right: -7px;
      background: var(--red); color: var(--white);
      border-radius: 50%; width: 20px; height: 20px;
      font-size: .7rem; display: flex; align-items: center; justify-content: center;
      font-weight: 900;
    }

    /* entries selector */
    .entries-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; font-size: .82rem; color: var(--brown-mid);
    }
    .entries-row select {
      border: 1.5px solid var(--border); border-radius: 4px;
      padding: 3px 8px; font-family: 'Lato', sans-serif; font-size: .82rem;
      background: var(--white); color: var(--brown); outline: none;
    }

    /* search */
    .search-row {
      display: flex; justify-content: flex-end; margin-bottom: 10px;
    }
    .search-row input {
      border: 1.5px solid var(--border); border-radius: 6px;
      padding: 7px 14px; font-family: 'Lato', sans-serif; font-size: .82rem;
      width: 220px; outline: none; background: var(--white);
      transition: border-color .2s;
    }
    .search-row input:focus { border-color: var(--brown-mid); }

    /* table */
    .table-wrap {
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 3px 18px rgba(59,33,18,.09);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    thead tr { background: var(--th-bg); }
    th {
      padding: 13px 14px; text-align: center;
      font-weight: 700; letter-spacing: .5px; color: var(--brown-mid);
      border-bottom: 2px solid var(--border); white-space: nowrap;
    }
    th.left { text-align: left; }
    td {
      padding: 11px 14px; border-bottom: 1px solid #eee;
      text-align: center; color: var(--brown); vertical-align: middle;
    }
    td.left { text-align: left; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--row-hover); }
    tr.selected td { background: #fff8e1; }

    /* checkbox */
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--brown); cursor: pointer; }

    /* client cell */
    .client-name { font-weight: 700; font-size: .85rem; }
    .client-email { font-size: .72rem; color: #888; }

    /* status badge */
    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px; border-radius: 20px;
      font-size: .72rem; font-weight: 700; letter-spacing: .5px;
    }
    .badge-active   { background: #d4edda; color: #1e7e34; }
    .badge-inactive { background: #ffe5d0; color: #b84a0a; }
    .badge-pending  { background: #fff3cd; color: #856404; }

    /* action icons */
    .icon-btn {
      background: none; border: none; cursor: pointer;
      padding: 5px; border-radius: 5px; transition: background .15s, transform .1s;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--cream); transform: scale(1.15); }
    .icon-edit  { color: #555; }
    .icon-check { color: var(--green); }
    .icon-block { color: #aaa; }
    .icon-trash { color: var(--red); }

    /* pagination */
    .pag-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 4px 0; font-size: .8rem; color: var(--brown-mid); flex-wrap: wrap; gap: 10px;
    }
    .pag-btns { display: flex; gap: 6px; }
    .pag-btn {
      border: 1.5px solid var(--border); background: var(--white);
      color: var(--brown-mid); border-radius: 5px; padding: 5px 12px;
      font-size: .8rem; cursor: pointer; font-family: 'Lato', sans-serif;
      transition: background .15s;
    }
    .pag-btn:hover, .pag-btn.active { background: var(--brown); color: var(--white); border-color: var(--brown); }

    /* modal overlay */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 12px;
      padding: 32px 36px; width: 420px; max-width: 95vw;
      box-shadow: 0 8px 40px rgba(0,0,0,.22);
    }
    .modal h2 {
      font-size: 1.1rem; font-weight: 900; margin-bottom: 20px;
      text-transform: uppercase; letter-spacing: 1px; color: var(--brown);
    }
    .modal .mfield { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .modal label { font-size: .78rem; font-weight: 700; color: var(--brown-mid); letter-spacing: .5px; }
    .modal input, .modal select {
      border: 1.5px solid var(--border); border-radius: 6px;
      padding: 9px 12px; font-family: 'Lato', sans-serif; font-size: .88rem;
      color: var(--brown); outline: none; background: var(--white);
      transition: border-color .2s;
    }
    .modal input:focus, .modal select:focus { border-color: var(--brown-mid); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .modal-actions .btn { padding: 10px 22px; }
    .btn-cancel { background: #eee; color: var(--brown); }
  </style>
</head>
<body>

<div class="top-bar">
  <span class="brand">Nombre del Restaurante</span>
  <span class="admin-tag">Admin</span>
</div>

<div class="page">
  <h1>Gestión del Restaurante</h1>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-activo" onclick="filterStatus('active')">Activo</button>
    <button class="btn btn-eliminar" onclick="deleteSelected()">Eliminar</button>
    <button class="btn-add" onclick="openModal()" title="Añadir reserva">+</button>
    <div class="notif-box" onclick="toggleNotif()">
      Notificaciones:
      <span class="notif-badge" id="notifBadge">3</span>
    </div>
  </div>

  <!-- Entries + search -->
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
    <div class="entries-row">
      Mostrar entradas
      <select id="entriesSelect" onchange="renderTable()">
        <option>5</option><option selected>10</option><option>25</option><option>50</option>
      </select>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Buscar…" oninput="renderTable()"/>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="reservasTable">
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll" onchange="toggleAll(this)"/></th>
          <th>No.</th>
          <th class="left">Cliente</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Comensales</th>
          <th>Mesa</th>
          <th>Añadido por</th>
          <th>Editar</th>
          <th>Status</th>
          <th>Eliminar</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pag-row">
    <span id="pagInfo">Mostrando 1–10 de 10</span>
    <div class="pag-btns">
      <button class="pag-btn" onclick="changePage(-1)">‹ Anterior</button>
      <button class="pag-btn active" id="pageBtn">1</button>
      <button class="pag-btn" onclick="changePage(1)">Siguiente ›</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nueva Reserva</h2>
    <div class="mfield"><label>Nombre del Cliente</label><input id="mNombre" type="text" placeholder="Nombre completo"/></div>
    <div class="mfield"><label>Email</label><input id="mEmail" type="email" placeholder="correo@ejemplo.com"/></div>
    <div class="mfield"><label>Fecha</label><input id="mFecha" type="date"/></div>
    <div class="mfield"><label>Hora</label><input id="mHora" type="time"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="mfield"><label>Comensales</label><input id="mComensales" type="number" min="1" max="20" value="2"/></div>
      <div class="mfield"><label>Mesa</label><input id="mMesa" type="text" placeholder="Mesa 1"/></div>
    </div>
    <div class="mfield">
      <label>Status</label>
      <select id="mStatus">
        <option value="active">Activo</option>
        <option value="pending">Pendiente</option>
        <option value="inactive">Cancelado</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-activo" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<script>
  // ── DATA ──
  let reservas = [
    { id:1, nombre:'Miguel Morales', email:'mike@gmail.com',   fecha:'2026-03-10', hora:'14:00', comensales:2, mesa:'Mesa 3',  addedBy:'Admin', status:'active'   },
    { id:2, nombre:'Víctor Díaz',    email:'victordiaz@gmail.com', fecha:'2026-03-11', hora:'15:30', comensales:4, mesa:'Mesa 7',  addedBy:'Admin', status:'active'   },
    { id:3, nombre:'Laura Pérez',    email:'laura@email.com',  fecha:'2026-03-12', hora:'13:00', comensales:3, mesa:'Mesa 1',  addedBy:'Admin', status:'pending'  },
    { id:4, nombre:'Carlos Ruiz',    email:'carlos@email.com', fecha:'2026-03-12', hora:'20:00', comensales:6, mesa:'Booth 2', addedBy:'Admin', status:'inactive' },
    { id:5, nombre:'Ana García',     email:'ana@email.com',    fecha:'2026-03-13', hora:'14:30', comensales:2, mesa:'Mesa 5',  addedBy:'Admin', status:'active'   },
    { id:6, nombre:'Roberto Soto',   email:'rsoto@email.com',  fecha:'2026-03-14', hora:'19:00', comensales:5, mesa:'Mesa 11', addedBy:'Admin', status:'pending'  },
    { id:7, nombre:'Mariana López',  email:'mlopez@email.com', fecha:'2026-03-15', hora:'13:30', comensales:4, mesa:'Mesa 8',  addedBy:'Admin', status:'active'   },
    { id:8, nombre:'José Hernández', email:'jhz@email.com',    fecha:'2026-03-16', hora:'21:00', comensales:8, mesa:'Mesa 14', addedBy:'Admin', status:'inactive' },
  ];

  let currentPage = 1;
  let editId = null;
  let filterSt = null;

  function statusLabel(s) {
    if (s === 'active')   return '<span class="status-badge badge-active">✓ Activo</span>';
    if (s === 'inactive') return '<span class="status-badge badge-inactive">⊘ Cancelado</span>';
    return '<span class="status-badge badge-pending">⏳ Pendiente</span>';
  }

  function renderTable() {
    const q      = document.getElementById('searchInput').value.toLowerCase();
    const limit  = parseInt(document.getElementById('entriesSelect').value);
    let data = reservas.filter(r => {
      const matchQ = !q || r.nombre.toLowerCase().includes(q) || r.email.toLowerCase().includes(q) || r.mesa.toLowerCase().includes(q);
      const matchS = !filterSt || r.status === filterSt;
      return matchQ && matchS;
    });

    const total = data.length;
    const start = (currentPage - 1) * limit;
    const page  = data.slice(start, start + limit);

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    page.forEach((r, i) => {
      tbody.innerHTML += `
        <tr id="row-${r.id}">
          <td><input type="checkbox" class="row-cb" data-id="${r.id}"/></td>
          <td>${start + i + 1}</td>
          <td class="left">
            <div class="client-name">${r.nombre}</div>
            <div class="client-email">${r.email}</div>
          </td>
          <td>${r.fecha}</td>
          <td>${r.hora}</td>
          <td>${r.comensales}</td>
          <td>${r.mesa}</td>
          <td>${r.addedBy}</td>
          <td>
            <button class="icon-btn icon-edit" onclick="editRow(${r.id})" title="Editar">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 13l6.5-6.5a2 2 0 112.828 2.828L11.828 15.828a4 4 0 01-1.414.94l-3 1 1-3a4 4 0 01.94-1.414z"/>
              </svg>
            </button>
          </td>
          <td>${statusLabel(r.status)}</td>
          <td>
            <button class="icon-btn icon-trash" onclick="deleteRow(${r.id})" title="Eliminar">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </td>
        </tr>`;
    });

    const end = Math.min(start + limit, total);
    document.getElementById('pagInfo').textContent =
      total ? `Mostrando ${start+1}–${end} de ${total}` : 'Sin resultados';
  }

  function toggleAll(cb) {
    document.querySelectorAll('.row-cb').forEach(c => c.checked = cb.checked);
  }

  function filterStatus(s) {
    filterSt = filterSt === s ? null : s;
    currentPage = 1;
    renderTable();
  }

  function deleteRow(id) {
    if (!confirm('¿Eliminar esta reserva?')) return;
    reservas = reservas.filter(r => r.id !== id);
    renderTable();
  }

  function deleteSelected() {
    const ids = [...document.querySelectorAll('.row-cb:checked')].map(c => parseInt(c.dataset.id));
    if (!ids.length) { alert('Selecciona al menos una reserva.'); return; }
    if (!confirm(`¿Eliminar ${ids.length} reserva(s)?`)) return;
    reservas = reservas.filter(r => !ids.includes(r.id));
    renderTable();
  }

  function changePage(d) {
    const limit = parseInt(document.getElementById('entriesSelect').value);
    const total = reservas.length;
    const maxP  = Math.ceil(total / limit);
    currentPage = Math.max(1, Math.min(currentPage + d, maxP));
    renderTable();
  }

  // ── MODAL ──
  function openModal(id = null) {
    editId = id;
    const r = id ? reservas.find(x => x.id === id) : null;
    document.getElementById('modalTitle').textContent = id ? 'Editar Reserva' : 'Nueva Reserva';
    document.getElementById('mNombre').value     = r ? r.nombre : '';
    document.getElementById('mEmail').value      = r ? r.email  : '';
    document.getElementById('mFecha').value      = r ? r.fecha  : '';
    document.getElementById('mHora').value       = r ? r.hora   : '';
    document.getElementById('mComensales').value = r ? r.comensales : 2;
    document.getElementById('mMesa').value       = r ? r.mesa   : '';
    document.getElementById('mStatus').value     = r ? r.status : 'active';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  function editRow(id) { openModal(id); }

  function saveModal() {
    const nombre     = document.getElementById('mNombre').value.trim();
    const email      = document.getElementById('mEmail').value.trim();
    const fecha      = document.getElementById('mFecha').value;
    const hora       = document.getElementById('mHora').value;
    const comensales = parseInt(document.getElementById('mComensales').value);
    const mesa       = document.getElementById('mMesa').value.trim();
    const status     = document.getElementById('mStatus').value;
    if (!nombre || !fecha || !hora) { alert('Completa los campos obligatorios.'); return; }

    if (editId) {
      const idx = reservas.findIndex(r => r.id === editId);
      reservas[idx] = { ...reservas[idx], nombre, email, fecha, hora, comensales, mesa, status };
    } else {
      const maxId = reservas.length ? Math.max(...reservas.map(r => r.id)) : 0;
      reservas.push({ id: maxId + 1, nombre, email, fecha, hora, comensales, mesa, addedBy: 'Admin', status });
      document.getElementById('notifBadge').textContent =
        parseInt(document.getElementById('notifBadge').textContent) + 1;
    }
    closeModal();
    renderTable();
  }

  function toggleNotif() {
    alert('Últimas notificaciones:\n• Nueva reserva: Ana García\n• Cancelación: Carlos Ruiz\n• Recordatorio: Mesa 14 mañana');
    document.getElementById('notifBadge').textContent = '0';
  }

  // close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  renderTable();
</script>
</body>
</html>
