<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Administrador – La Naolinqueña</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="CSS/Styles.css"/>
  <link rel="stylesheet" href="CSS/loginadministrador.css"/>
</head>
<body>

<header>
  <div class="logo">La Naolinqueña</div>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="menu.html">Menú</a>
    <a href="loginusuario.html">Reservas</a>
    <a href="gestordemesas.html">Mesas</a>
    <a href="infocliente.html">Clientes</a>
    <a href="loginadministrador.html">Admin</a>
  </nav>
</header>

<div class="top-bar">La Naolinqueña</div>

<div class="page">

  <!-- LEFT: form -->
  <div class="left">
    <h2>Administrador</h2>

    <div class="field">
      <label for="email">Email:</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="admin@lanaolinquena.mx" autocomplete="username"/>
      </div>
    </div>

    <div class="field">
      <label for="password">Password:</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="toggle-pw" type="button" onclick="togglePw()" title="Mostrar/ocultar">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-signin" onclick="signIn()">Sign In</button>

    <div class="error-msg" id="errorMsg">
      Credenciales incorrectas. Intenta de nuevo.
    </div>
  </div>

  <!-- RIGHT: branding + photo -->
  <div class="right">
    <h1>Login</h1>

    <div class="divider">
      <hr/>
      <span style="font-size:.75rem;color:var(--brown-mid);letter-spacing:1px;white-space:nowrap">LA NAOLINQUEÑA</span>
      <hr/>
    </div>

    <div class="photo-frame">
      <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=700&q=85" alt="Bebidas del restaurante"/>
    </div>
  </div>

</div>

<script>
  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`;
    } else {
      pw.type = 'password';
      icon.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
    }
  }

  function signIn() {
    const email = document.getElementById('email').value.trim();
    const pw    = document.getElementById('password').value;
    const err   = document.getElementById('errorMsg');

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    })
      .then(r => r.json())
      .then(d => {
        if (d && d.ok) {
          err.classList.remove('visible');
          sessionStorage.setItem('admin_ok', '1');
          sessionStorage.setItem('admin_email', d.admin.email);
          window.location.href = 'gestordereservas.html';
        } else {
          err.classList.add('visible');
        }
      })
      .catch(() => err.classList.add('visible'));
  }

  // Allow Enter key
  document.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
</script>

</body>
</html>
